name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run parser tests on simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme VS \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcpretty || tail -n 200 build/test-last-log.txt || true
      - name: Keep raw log on failure
        if: failure()
        run: |
          xcodebuild test -scheme VS -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO > raw-test.log 2>&1 || true
          grep -nE "error:|failed|XCTAssert" raw-test.log | tail -n 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: raw-test.log
          optional: true

  device-build:
    needs: unit-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project VS.xcodeproj \
            -scheme VS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Assert app bundle and pack IPA
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -d "$APP"
          test -f "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | grep -E "com.vs.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VS-unsigned.ipa Payload
          ls -l VS-unsigned.ipa
          shasum -a 256 VS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VS-unsigned-ipa
          path: VS-unsigned.ipa
