name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install pinned XcodeGen
        uses: ./.github/actions/setup-xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: 写模拟器专用的签名 entitlements（CI 无描述文件，钥匙串要 application-identifier）
        run: |
          set -euo pipefail
          mkdir -p Support
          cat > Support/VS.simulator.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.com.vs.app</string></array>
            <key>com.apple.application-identifier</key>
            <string>com.vs.app</string>
            <key>keychain-access-groups</key>
            <array><string>com.vs.app</string></array>
          </dict>
          </plist>
          PLIST
          plutil -lint Support/VS.simulator.entitlements
      - name: Unit tests on simulator
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-18-")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid // empty')
          if test -z "$DEST"; then
            echo "缺少可用的 iOS 18 模拟器，拒绝使用其他系统版本替代"
            exit 1
          fi
          echo "SIM_DEST=$DEST" >> "$GITHUB_ENV"
          echo "使用 iOS 18 模拟器：$DEST"
          xcodebuild test \
            -project VS.xcodeproj \
            -scheme VS \
            -only-testing:VSTests \
            -destination "platform=iOS Simulator,id=$DEST" \
            -derivedDataPath DerivedData \
            -resultBundlePath UnitResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS=Support/VS.simulator.entitlements \
            2>&1 | tee unit.log
      - name: Restart simulator so UI tests cannot attach to a leftover unit host
        id: restart
        if: always()
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIM_DEST" || true
          xcrun simctl boot "$SIM_DEST"
          xcrun simctl bootstatus "$SIM_DEST" -b
      - name: UI tests on simulator
        id: ui
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project VS.xcodeproj \
            -scheme VS \
            -only-testing:VSUITests \
            -destination "platform=iOS Simulator,id=$SIM_DEST" \
            -derivedDataPath DerivedData \
            -resultBundlePath UIResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS=Support/VS.simulator.entitlements \
            2>&1 | tee ui.log
      - name: 两套 Suite 都要绿，红的也照样取回两份日志
        if: always()
        run: |
          set -euo pipefail
          status=0
          if test "${{ steps.unit.outcome }}" != "success"; then
            echo "单元 Suite 失败（读数见 unit.log）"; status=1
          fi
          if test "${{ steps.ui.outcome }}" != "success"; then
            echo "UI Suite 失败（读数见 ui.log）"; status=1
          fi
          if test "${{ steps.restart.outcome }}" != "success"; then
            echo "模拟器重启失败，UI 读数不可信"; status=1
          fi
          echo "unit=${{ steps.unit.outcome }} restart=${{ steps.restart.outcome }} ui=${{ steps.ui.outcome }}"
          exit $status
      - name: Export UI evidence
        if: always()
        run: |
          if test -d UIResults.xcresult; then
            xcrun xcresulttool export attachments --path UIResults.xcresult --output-path ui-evidence
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-log
          path: |
            unit.log
            ui.log
            ui-evidence

  device-build:
    needs: unit-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        uses: ./.github/actions/setup-xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project VS.xcodeproj \
            -scheme VS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee device-build.log
      - name: Assert app bundle and pack IPA
        run: |
          set -euo pipefail
          APP=DerivedData/Build/Products/Release-iphoneos/VS.app
          test -d "$APP"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist" | grep -E "^com\.vs\.app$"
          test -z "$(find "$APP" -name '*.appex' -print)"
          test ! -e "$APP/embedded.mobileprovision"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VS-unsigned.ipa Payload
          ls -l VS-unsigned.ipa
          shasum -a 256 VS-unsigned.ipa
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib
          ipa = pathlib.Path('VS-unsigned.ipa')
          info = plistlib.loads(pathlib.Path('Payload/VS.app/Info.plist').read_bytes())
          manifest = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'tests': 'success',
              'signed': False,
              'file': ipa.name,
              'sha256': hashlib.sha256(ipa.read_bytes()).hexdigest(),
              'bundle_id': info['CFBundleIdentifier'],
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'minimum_ios': info['MinimumOSVersion'],
          }
          pathlib.Path('artifact-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VS-unsigned-ipa
          if-no-files-found: error
          path: |
            VS-unsigned.ipa
            artifact-manifest.json
