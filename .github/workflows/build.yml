name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Unit tests on simulator
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-18-")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid // empty')
          if test -z "$DEST"; then
            echo "缺少可用的 iOS 18 模拟器，拒绝使用其他系统版本替代"
            exit 1
          fi
          echo "使用 iOS 18 模拟器：$DEST"
          xcodebuild test \
            -project VS.xcodeproj \
            -scheme VS \
            -destination "platform=iOS Simulator,id=$DEST" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log
      - name: Export UI evidence
        if: always()
        run: |
          if test -d TestResults.xcresult; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path ui-evidence
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-log
          path: |
            test.log
            ui-evidence

  device-build:
    needs: unit-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project VS.xcodeproj \
            -scheme VS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee device-build.log
      - name: Assert app bundle and pack IPA
        run: |
          set -euo pipefail
          APP=DerivedData/Build/Products/Release-iphoneos/VS.app
          test -d "$APP"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist" | grep -E "^com\.vs\.app$"
          test -z "$(find "$APP" -name '*.appex' -print)"
          test ! -e "$APP/embedded.mobileprovision"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VS-unsigned.ipa Payload
          ls -l VS-unsigned.ipa
          shasum -a 256 VS-unsigned.ipa
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib
          ipa = pathlib.Path('VS-unsigned.ipa')
          info = plistlib.loads(pathlib.Path('Payload/VS.app/Info.plist').read_bytes())
          manifest = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'tests': 'success',
              'signed': False,
              'file': ipa.name,
              'sha256': hashlib.sha256(ipa.read_bytes()).hexdigest(),
              'bundle_id': info['CFBundleIdentifier'],
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'minimum_ios': info['MinimumOSVersion'],
          }
          pathlib.Path('artifact-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VS-unsigned-ipa
          if-no-files-found: error
          path: |
            VS-unsigned.ipa
            artifact-manifest.json
