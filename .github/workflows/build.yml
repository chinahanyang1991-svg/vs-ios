name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone (16|17)" | head -5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Unit tests on simulator
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[].value[] | select(.isAvailable and (.name | startswith("iPhone"))) | .name' | head -1)
          test -n "$DEST"
          echo "使用模拟器：$DEST"
          xcodebuild test \
            -project VS.xcodeproj \
            -scheme VS \
            -destination "platform=iOS Simulator,name=$DEST" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log

  device-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project VS.xcodeproj \
            -scheme VS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee device-build.log
      - name: Assert app bundle and pack IPA
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -d "$APP"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist" | grep -E "^com\.vs\.app$"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VS-unsigned.ipa Payload
          ls -l VS-unsigned.ipa
          shasum -a 256 VS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VS-unsigned-ipa
          path: VS-unsigned.ipa
